# =============================================================================
# CI: a ogni push e pull request GitHub verifica il progetto su una macchina pulita.
#
#   1. lint + test        ruff e pytest (LLM ed embedding finti: niente Ollama)
#   2. quality gate       valutazioni deterministiche (guardrail, retrieval BM25)
#                         confrontate con le soglie di eval/datasets/quality_gates.json:
#                         se una metrica scende sotto soglia la pipeline si ferma
#   3. smoke test         avvia l'API vera, ci si collega e prova gli endpoint
#   4. docker build       l'immagine si costruisce e il container risponde
#
# La valutazione dell'AGENTE non gira qui: richiede un LLM vero (Ollama o API
# cloud). Si lancia in locale o in un job dedicato con le chiavi nei segreti:
#   pmc eval agent && pmc eval gate --kind agent
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PMC_FORCE_SYNTHETIC_DATA: "true"   # niente download da UCI in CI
  PMC_EMBEDDING_PROVIDER: fake       # embedding deterministici senza Ollama
  PMC_LANGFUSE_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest

  quality-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Dati, modello e indice
        run: pmc --plain-logs setup --quick
      - name: Gate del modello ML
        run: pmc --plain-logs eval gate --kind model
      - name: Gate dei guardrail
        run: |
          pmc --plain-logs eval guardrails --label "CI ${GITHUB_SHA::7}"
          pmc --plain-logs eval gate --kind guardrails
      - name: Gate del retrieval (BM25, deterministico)
        run: |
          pmc --plain-logs eval retrieval --mode bm25 --label "CI ${GITHUB_SHA::7}"
          pmc --plain-logs eval gate --kind retrieval

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pmc --plain-logs setup --quick
      - name: Avvia l'API e attendi che sia viva
        run: |
          uvicorn pmcopilot.api.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health/live && break; sleep 2; done
        env:
          PMC_SCHEDULER_ENABLED: "false"
      - name: Smoke test
        run: pytest -m smoke tests/smoke
        env:
          PMC_SMOKE_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Costruisci l'immagine
        run: docker build -t pmcopilot:ci .
